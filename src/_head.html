<!-- Set theme before first paint: saved choice wins, otherwise respect OS preference.
     Runs synchronously so style.css's [data-theme="light"] rules apply with zero flash. -->
<script>
(function(){
  var t = localStorage.getItem('jt-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
})();
</script>

<!-- ── Fonts: self-hosted ────────────────────────────────────────────
     Previously both faces came from fonts.googleapis.com via the
     media="print" onload trick. That loads asynchronously, so the page
     always painted in the fallbacks ('Arial Black' for headings, system
     UI for body) and then re-laid-out every line of text when the real
     faces arrived. The 2026-09-21 PageSpeed run measured the cost:
     CLS 0.372 on mobile (attributed to the hero H1's own <span class="glow">)
     and 0.103 on desktop, i.e. almost all of both scores' layout shift.
     Orbitron and 'Arial Black' have very different advance widths, so the
     H1 re-wrapped and, on the two-column desktop hero, dragged the art
     column with it.

     Self-hosting fixes it at the source: one variable woff2 per family,
     latin subset, same origin, preloaded so the bytes are in flight
     during the HTML parse. font-display:optional is the guarantee — it
     tells the browser to use the fallback for this page view rather than
     swap after first paint, so a slow network can cost the webfont but
     can never cost layout stability.

     crossorigin is required on a font preload even same-origin: font
     fetches always use CORS mode, and without it the preload is
     discarded and the file is fetched a second time.

     Two glyphs the site uses (→ ▶ ●) fall outside Google's "latin"
     subset. They already fell back to a system face with the CDN build,
     so nothing changes there.

     Licences: both families are SIL OFL 1.1 — see fonts/OFL-*.txt. -->
<link rel="preload" href="./fonts/orbitron-latin-var.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="preload" href="./fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin/>

<!-- Marquee brand icons served from Simple Icons CDN -->
<link rel="preconnect" href="https://cdn.simpleicons.org"/>
<link rel="dns-prefetch" href="https://cdn.simpleicons.org"/>


<!-- Inline critical CSS: renders the hero skeleton instantly before style.css downloads.
     Only above-the-fold essentials — full styles are in style.css below. -->
<style>
/* @font-face lives here rather than in src/styles/ so the faces are
   registered in the same parse step that kicks off the preloads above —
   a declaration arriving with style.css would be too late to matter. */
@font-face{font-family:'Orbitron';src:url('./fonts/orbitron-latin-var.woff2') format('woff2');font-weight:400 900;font-style:normal;font-display:optional}
@font-face{font-family:'Plus Jakarta Sans';src:url('./fonts/plus-jakarta-sans-latin-var.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:optional}
/* Critical: body base so there's no white flash */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060e1a;--cyan:#00d4ff;--text:#e8f4ff;--font-head:'Orbitron','Arial Black',sans-serif;--font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);opacity:0;animation:page-fadein .5s ease .05s forwards}
@keyframes page-fadein{to{opacity:1}}
/* Critical nav — visible immediately on load */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:.9rem 2rem;background:transparent}
/* Critical hero skeleton */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6rem 1.5rem 3rem;position:relative;overflow:hidden}
h1{font-family:var(--font-head);font-size:clamp(2rem,7vw,5rem);font-weight:900;color:#fff;line-height:1.08}
.glow{color:var(--cyan)}
</style>
