<!-- ══ BACK TO TOP ══ -->
<!-- Fixed bottom-right button. Visible only after 400px of scroll (main.js).
     .btt-ring SVG has two circles: .btt-track (faint full ring) and .btt-progress
     (fills clockwise as you scroll — stroke-dashoffset driven by main.js). -->
<a href="#" id="back-to-top" aria-label="Back to top">
  <svg class="btt-ring" viewBox="0 0 44 44" aria-hidden="true">
    <circle class="btt-track" cx="22" cy="22" r="18"/><!-- faint background ring -->
    <circle class="btt-progress" cx="22" cy="22" r="18"/><!-- fills with scroll progress -->
  </svg>
  <svg class="btt-icon" viewBox="0 0 24 24" aria-hidden="true">
    <polyline points="18 15 12 9 6 15"/><!-- upward chevron -->
  </svg>
</a>

<!-- ══ AVAILABLE PILL ══ -->
<!-- One pill, not two. There used to be an "Available for Projects" pill
     and a "Get In Touch" pill stacked above this button, both linking to
     #contact. Merged, it says both things in one target. Hidden while the
     hero, the contact section or the footer is on screen (effects.js):
     there it either is not needed yet or points at where you already are.
     Points at the form, not a mailto: a mailto on a phone with no mail app
     does nothing, which reads as a broken site. -->
<a href="#contact" id="avail-pill">
  <span class="avail-pill-dot" aria-hidden="true"></span>Available · Let's talk
</a>
