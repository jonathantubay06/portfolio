<!-- ══ SCRIPTS ══ -->
<!-- Both scripts use `defer` — they run after HTML parsing, in order,
     without blocking the browser from rendering the first frame.
     main.js   : critical interactivity (nav, modals, forms, carousel)
     effects.js: visual enhancements (cursor, spotlight, tokens, clock)
     If effects.js fails for any reason, the whole site still works. -->
<script src="./main.js" defer></script>
<script src="./effects.js" defer></script>
</body>
</html>
