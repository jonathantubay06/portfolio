# Owner: Jojo (personal). Quality gate for every push and pull request:
# builds the site, runs Lighthouse (performance warns, accessibility, best
# practices and SEO fail the run) and checks every link in the built pages.
# Actions are pinned to commit SHAs (a moved tag cannot swap the code under
# us) and the job token can only read. Runs on GitHub, not on Netlify, so it
# costs no Netlify build credits; Dependabot keeps the pins current.
name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        run: node build.js
      - name: Lighthouse
        run: npx -y @lhci/cli@0.15.1 autorun
      - name: Broken links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress --max-retries 2 --fallback-extensions html
            --accept 200..=299,403,429,999
            --exclude linkedin\.com --exclude api\.whatsapp\.com
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
