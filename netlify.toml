[build]
  # build.js assembles src/ into dist/. Publishing dist rather than "."
  # means only built output ships — internal working folders can no longer
  # leak just because a .gitignore line was missed.
  command = "bash scripts/update-sitemap.sh && node build.js"
  publish = "dist"

# ── Caching ──────────────────────────────────────────────
# Netlify's default for static files is `max-age=0,must-revalidate`, which
# costs a conditional request per asset on every return visit. Filenames here
# are not content-hashed, so long-lived immutable caching is only safe for
# assets that change with a new filename. CSS/JS keep a short max-age plus
# revalidation; images and fonts are effectively immutable in practice.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
