[build]
  # build.js assembles src/ into dist/. Publishing dist rather than "."
  # means only built output ships — internal working folders can no longer
  # leak just because a .gitignore line was missed.
  command = "node build.js"
  publish = "dist"
  # 2026-10-18 (no wasted rebuilds): skip the Netlify build (exit 0) when a
  # push only touches files the site never serves.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)history' ':(exclude)README.md' ':(exclude).gitignore'"

# ── Caching ──────────────────────────────────────────────
# Netlify's default for static files is `max-age=0,must-revalidate`, which
# costs a conditional request per asset on every return visit.
#
# build.js now writes the CSS and JS as style.<hash>.css, main.<hash>.js and
# effects.<hash>.js, so a changed file always arrives under a new URL and a
# stale copy can never be served. That makes `immutable` correct for them —
# previously the names were fixed, the only safe policy was a one-hour
# max-age plus revalidation, and PageSpeed flagged all three files under
# "Use efficient cache lifetimes".
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are versioned by filename too (the subset is baked into the name),
# and they are the one asset a repeat visitor must never re-fetch.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers (2026-10-07 audit) ──────────────────────────────
# Only HSTS was being sent. The CSP allowlist is built from what the pages
# actually load:
#   script  self + inline (theme bootstrap in <head>, the stylesheet
#           onerror), jsDelivr (three.js ESM, desktop 3D only), the
#           Cloudflare analytics beacon; 'wasm-unsafe-eval' for the meshopt
#           decoder that unpacks scene.glb; Google reCAPTCHA (Netlify
#           injects api.js for the contact form's data-netlify-recaptcha;
#           blocked until 2026-10-22, so the widget never rendered)
#   frame   reCAPTCHA's checkbox and challenge iframes
#   style   self + inline (style="--brand:…" attributes throughout)
#   img     self, data: (inline SVG backgrounds), blob: (GLB textures)
#   connect self (Netlify form post), blob:/data: (GLTFLoader reads its
#           embedded textures through blob URLs), Cloudflare RUM endpoint,
#           jsDelivr
# If Netlify's own Real User Monitoring is left on in the dashboard, its
# collector is not on this list: switch it off (the audit found two RUM
# scripts; Cloudflare's is the one this site chose) or add its host here.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://static.cloudflareinsights.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://cloudflareinsights.com; worker-src 'self' blob:; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"

# Browsers ask for /favicon.ico whatever the page declares; serve the PNG
# instead of a 404.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200
