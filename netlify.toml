[build]
  # build.js assembles src/ into dist/. Publishing dist rather than "."
  # means only built output ships — internal working folders can no longer
  # leak just because a .gitignore line was missed.
  command = "node build.js"
  publish = "dist"
  # 2026-10-18 (no wasted rebuilds): skip the Netlify build (exit 0) when a
  # push only touches files the site never serves.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)history' ':(exclude)README.md' ':(exclude).gitignore' ':(exclude).github' ':(exclude).lighthouserc.json'"

# ── Caching ──────────────────────────────────────────────
# Netlify's default for static files is `max-age=0,must-revalidate`, which
# costs a conditional request per asset on every return visit.
#
# build.js now writes the CSS and JS as style.<hash>.css, main.<hash>.js and
# effects.<hash>.js, so a changed file always arrives under a new URL and a
# stale copy can never be served. That makes `immutable` correct for them —
# previously the names were fixed, the only safe policy was a one-hour
# max-age plus revalidation, and PageSpeed flagged all three files under
# "Use efficient cache lifetimes".
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# self-hosted three.js bundle: the version is in the file name
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts are versioned by filename too (the subset is baked into the name),
# and they are the one asset a repeat visitor must never re-fetch.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers (2026-10-07 audit, tightened 2026-10-24) ───────
# The Content-Security-Policy is not here: build.js writes it to
# dist/_headers, because it lists a sha256 hash of every inline script the
# pages ship and those hashes change with the scripts. Netlify applies that
# file together with the headers below. See build.js ("security policy")
# for what each source is for.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), bluetooth=(), hid=(), serial=(), midi=(), display-capture=(), xr-spatial-tracking=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Whole domain is HTTPS-only (no other subdomains exist), preload-list ready.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"

# Browsers ask for /favicon.ico whatever the page declares; serve the PNG
# instead of a 404.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200
